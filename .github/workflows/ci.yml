name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  # 线上跑的是 Cloudflare Workers，不是 Node。这个 job 用 Workers 目标再构建一遍，
  # 谁在 server/ 里引入了 workerd 跑不了的东西（子进程、真实文件系统等），
  # 这里就会红，而不是等部署完线上才发现。
  cloudflare-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare Workers
        run: npm run build
        env:
          NITRO_PRESET: cloudflare_module

      - name: Assert Worker entry exists
        run: |
          test -f .output/server/index.mjs || { echo "Worker 入口缺失：Nitro 没有按 Workers 预设产出"; exit 1; }
          test -d .output/public || { echo "静态资源目录缺失"; exit 1; }
          echo "Worker 产物大小：$(du -sh .output/server | cut -f1)"
